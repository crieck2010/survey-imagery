[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "survey-imagery"
version = "0.1.1"
description = "Satellite imagery engine for surveying: STAC discovery, cloud masking, spectral indices, composites, time series, and per-pass site monitoring"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "crieck2010" }]
keywords = ["surveying", "remote-sensing", "satellite", "sentinel-2", "landsat", "STAC", "NDVI", "change-detection", "QGIS"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: GIS",
]
dependencies = [
    "numpy>=1.22",
    "rasterio>=1.3",
    "requests>=2.28",
]

[project.optional-dependencies]
dev = ["build", "twine"]

[project.scripts]
survey-imagery = "imagery.cli:main"

[project.urls]
Homepage = "https://github.com/crieck2010/survey-imagery"
Repository = "https://github.com/crieck2010/survey-imagery"
Issues = "https://github.com/crieck2010/survey-imagery/issues"

[tool.setuptools.packages.find]
where = ["src"]
